[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]

name = "pyscaLR"
version = "1.2.0"
requires-python = ">=3.11,<3.15"
authors = [
  { name="Infocusp", email="saurabh@infocusp.com" },
]
description = "scaLR: Single cell analysis using low resource."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]

dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pre_commit>=4,<5", "isort>=5.13,<7", "yapf>=0.40,<1"]
hub = ["huggingface_hub>=0.24,<1"]

[project.scripts]
scalr = "scalr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scalr"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build]
exclude = [
  "docs/*",
  "tutorials/*",
  "tests/*",
  "scalr/**/test_*.py",
  "scaLR_v2_implementation_blueprint.md",
]

license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/infocusp/scaLR.git"
Homepage = "https://github.com/infocusp/scaLR"
Issues = "https://github.com/infocusp/scaLR/issues"
Documentation = "https://infocusp.github.io/scaLR/"
Changelog = "https://github.com/infocusp/scaLR/blob/main/CHANGELOG.md"
